# MINT Stage 1 pretraining recipe with three public data sources.
# Run from the repository root and configure the local asset and dataset paths.
model:
  name: split_fov_head
  pretrained: assets/models/lingbot-map.pt
  pretrained_exclude: ["camera_head*"]
  enable_hand: true
  hand_head:
    name: refine
    dim: 512
    num_queries: 4
    num_iterations: 2
    trunk_depth: 1
    rotation_refine_mode: compose_axis_angle
    rotation_delta_frame: local
    rotation_delta_max_angle_deg: 30.0
  enable_hand_presence: true
  hand_presence_head:
    dim: 256
    num_heads: 4
  fov_head:
    dim: 512
    num_heads: 8
    trunk_depth: 2
    initial_fov_deg: [60.0, 75.0]
    min_fov_rad: 1.0e-4
  backbone:
    img_size: 518
    patch_size: 14
    embed_dim: 1024
    use_sdpa: true
    use_gradient_checkpoint: true
    camera_num_iterations: 4
    enable_camera: true
    enable_depth: false
    enable_point: false
    enable_local_point: false

data:
  name: lerobot_v3
  root:
    - data/lerobot/ego4d/lerobot_v3
    - data/lerobot/egodex/lerobot_v3
    - data/lerobot/epickitchen/lerobot_v3
  camera_translation_normalization:
    enabled: true
    cache_dir: output/cache/camera_normalization
    workers: 32
    files_per_task: 8
    window_batch_size: 4096
  clip_len: 32
  clip_stride: 32
  size_hw: [378, 518]
  batch_size: 1
  num_workers: 8
  shuffle: true
  require_mano_gt: true
  require_kpt21_gt: false

loss:
  hand_presence:
    weight: 2.0
  image_hand:
    weight: 0.01
    min_depth: 0.01
    presence_threshold: 0.0
  camera:
    weight: 1.0
    terms:
      - {name: trans_l1, weight: 0.025}
      - {name: trans_scale_aligned_l1, weight: 0.25}
      - {name: rot_geo, weight: 0.5}
      - {name: rot_vel_geo, weight: 0.25}
  fov:
    weight: 2.0
    terms:
      - {name: fov_l1, weight: 1.0}
      - {name: fov_vel_l1, weight: 0.05}
  mano_param:
    weight: 1.0
    terms:
      - {name: transl_l1, weight: 2.0}
      - {name: orient_geo, weight: 1.0}
      - {name: pose_geo, weight: 1.0}
      - {name: betas_l1, weight: 0.3}
      - {name: betas_consistency_l1, weight: 0.2}
      - {name: transl_vel_l1, weight: 0.25}
      - {name: orient_vel_geo, weight: 0.25}
      - {name: transl_acc_l1, weight: 0.25}
      - {name: orient_acc_geo, weight: 0.1}

train:
  run_name: null
  reproducibility:
    enabled: true
    seed: 42
    deterministic_algorithms: false
  epochs: 1
  log_every: 5
  ckpt_every: 500
  grad_clip: 0.0
  grad_value_clip: 1.0
  grad_accum: 1
  mixed_precision: bf16
  wandb:
    enabled: true
    project: lingbotmap-distill
    name: null
    mode: offline

optim:
  lr: 1.0e-4
  param_groups:
    - {match: backbone.camera_head, lr: 1.0e-4}
    - {match: backbone.fov_head, lr: 1.0e-4}
    - {match: backbone, lr: 5.0e-5}
    - {match: hand_head, lr: 5.0e-4}
    - {match: hand_presence_head, lr: 5.0e-4}
  weight_decay: 0.05
  warmup_steps: 2000

dist:
  nnodes: 1
  gpus_per_node: 8
  master_addr: 127.0.0.1
  master_port: 29500

aliyun:  # Configure these placeholders before submitting a cloud training job.
  region: cn-hangzhou
  workspace_id: "REPLACE_ME"
  resource_id: "REPLACE_ME"
  image: "REPLACE_ME"
  cpfs_uri: "bmcpfs://REPLACE_ME/"
  repo_dir: "/workspace/wuji-ego-mint"
  nnodes: 8
  gpus_per_node: 8
  worker_cpu: 184
  worker_memory: 1800Gi
  worker_shared_memory: 1800Gi
  conda_env: mint
  job_name: mint-stage1
